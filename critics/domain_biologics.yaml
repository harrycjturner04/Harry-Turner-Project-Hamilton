# Domain-specific analytical expectations for the AnalyticalDepthCritic.
# WP-C3a: Loaded by the depth critic based on detect_data_domains() output.
# Add new domains by creating domain_<name>.yaml files in this directory.
#
# detection_keywords:  column-name substrings used by the critic's fallback
#                      domain detection when domain_hints are absent from the
#                      analysis summary.  Matched case-insensitively against
#                      the cleaned dataset's column names.
# required_analyses:   analysis types the critic expects to find mentioned in
#                      the findings text.  Each entry needs only 'analysis'
#                      (matched in findings) and 'description' (human context).
# interpretation_vocabulary: domain terms indicating interpretive depth.

expectations:
  chromatography:
    detection_keywords:
      - "retention"
      - "uv"
      - "mau"
      - "absorbance"
      - "elution"
      - "chromatogram"
    required_analyses:
      - analysis: "peak_detection"
        description: "Detect and characterise peaks in absorbance trace"
      - analysis: "run_to_run_comparison"
        description: "Compare key metrics across runs and stages"
      - analysis: "purity_ratio"
        description: "Compute absorbance ratio for purity assessment"
    interpretation_vocabulary:
      - "column degradation"
      - "resin lifetime"
      - "binding capacity"
      - "aggregate"
      - "monomer"
      - "resolution"
      - "plate count"
      - "asymmetry factor"
      - "peak tailing"
      - "process deviation"

  mass_spectrometry:
    detection_keywords:
      - "m/z"
      - "mass"
      - "charge"
      - "dalton"
      - "spectrum"
      - "deconvolution"
    required_analyses:
      - analysis: "mass_accuracy"
        description: "Compute mass accuracy (ppm deviation) for each species"
      - analysis: "charge_envelope"
        description: "Analyse charge state distribution and deconvolution"
    interpretation_vocabulary:
      - "glycoform"
      - "post-translational modification"
      - "deamidation"
      - "oxidation"
      - "mass shift"
      - "charge envelope"
      - "intact mass"
      - "sequence variant"
