name: harry_turner_project
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas>=2.1
  - pyarrow>=15
  - numpy
  - openpyxl
  - matplotlib>=3.7
  - seaborn>=0.12
  - scipy
  - pip
  - uv
  # pip packages are installed separately via:
  #   uv pip install -r Environments/requirements.txt
  # This avoids pip's resolution-too-deep errors on complex dependency graphs.